name: build-and-e2e

on:
  # 只监听 main push（含 release：本地打 tag 后 git push --tags，main+tag 同推，
  # 由 run 内检测 v* tag 决定是否发布）。不再监听 tag push，避免同提交跑两次 CI。
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: wps2pdf
  # WPS deb 附件：GitHub Release 自家 CDN，境外 runner 下载比阿里云更快更稳
  WPS_DEB_URL: https://github.com/xna00/wps-docker/releases/download/wps-11.1.0.9662/wps-office_11.1.0.9662_amd64.deb

jobs:
  # ------------------------------------------------------------------
  # 0) 文件变更过滤：仅镜像相关文件变化才跑构建
  #    tag 发布 / PR / 手动触发 直接放行；push main 按 paths-filter 判断
  # ------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      release: ${{ steps.tagcheck.outputs.release }}
      tag: ${{ steps.tagcheck.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # paths-filter 需要 diff against event.before
          fetch-tags: true # tag 从 checkout 起就可用（tagcheck 检测 v* tag 用）
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - 'Dockerfile'
              - 'Dockerfile.wps12'
              - 'entrypoint.sh'
              - 'convert_docx2pdf.py'
              - 'http_server.py'
              - 'libexitfix.c'
              - 'libmqsim.c'
              - 'download_wps12.sh'
              - 'pywpsrpc-src.tar.gz'
              - 'pywpsrpc-2.4.0-src.tar.gz'
              - 'fonts.tar.xz'
              - 'tests/**'
              - '.github/workflows/**'
              - '.dockerignore'

      # release 判定：main push 若 HEAD 带 v* tag（本地先打 tag 后 git push --tags 同推）
      # → release=true 并输出 tag 名，最后一步 publish 据此执行；否则只 build+test 结束。
      - name: 检测 HEAD 是否带 v* tag（决定是否发布）
        id: tagcheck
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        run: |
          git fetch --tags --prune --quiet
          TAG=$(git tag --points-at "$GITHUB_SHA" | grep -E '^v' | head -1 || true)
          if [ -n "$TAG" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "::notice::HEAD(${GITHUB_SHA:0:7}) 带 v* tag: ${TAG}，构建测试后发布 Docker Hub"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HEAD(${GITHUB_SHA:0:7}) 无 v* tag，仅构建+测试"
          fi

  # ------------------------------------------------------------------
  # 1) 构建镜像（WPS deb 走 GitHub Release，apt/pip 走阿里云，适配境外 runner）
  # ------------------------------------------------------------------
  build:
    needs: changes
    # 发布提交（带 v* tag）必须无条件构建+测试+发布，不受 paths-filter 影响；
    # 其余 main push 按 paths-filter 判断（仅镜像相关文件变化才构建）；PR / 手动触发直接放行
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.release == 'true' ||
      needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true            # 构建后载入本地，供 test job 使用
          tags: ${{ env.IMAGE_NAME }}:ci
          build-args: |
            WPS_DEB_URL=${{ env.WPS_DEB_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image for test job
        run: docker save ${{ env.IMAGE_NAME }}:ci -o /tmp/${{ env.IMAGE_NAME }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-image
          path: /tmp/${{ env.IMAGE_NAME }}.tar
          retention-days: 1

  # ------------------------------------------------------------------
  # 2) 端到端测试：容器内真跑一次 docx→pdf 并断言 PDF 产物
  # ------------------------------------------------------------------
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/${{ env.IMAGE_NAME }}.tar

      - name: Run end-to-end conversion test
        # 用 --entrypoint 覆盖镜像默认的 entrypoint（否则命令行参数会被当成输入文件）
        run: docker run --rm --entrypoint /bin/bash ${{ env.IMAGE_NAME }}:ci -c "/opt/wpsrpc-rpc/tests/e2e_test.sh"

  # ------------------------------------------------------------------
  # 3) 推送镜像到 Docker Hub（run 内检测到 v* tag 才发布）
  #    - 本地先打 tag → git push --tags（main+tag 同推）→ 本 job 执行：推 latest + 版本号
  #    - 无 tag 的 main push / PR / 手动触发：不发布，build+test 后结束
  #    需要仓库 Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN
  # ------------------------------------------------------------------
  push-dockerhub:
    needs: [build, test]
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true   # 让 tag 从 checkout 起就可用

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          # 自包含：本 job 内重新检测 HEAD 的 v* tag（不依赖跨 job 输出传递），
          # 未检测到则硬失败，避免发布出空版本号
          git fetch --tags --prune --quiet
          TAG_NAME=$(git tag --points-at "$GITHUB_SHA" | grep -E '^v' | head -1 || true)
          echo "检测到 tag: ${TAG_NAME:-<空>}"
          if [ -z "$TAG_NAME" ]; then
            echo "::error::HEAD(${GITHUB_SHA:0:7}) 未检测到 v* tag，拒绝发布"
            exit 1
          fi
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          TAGS="$REPO:latest,$REPO:${TAG_NAME}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "将推送: ${TAGS}"

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            WPS_DEB_URL=${{ env.WPS_DEB_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
