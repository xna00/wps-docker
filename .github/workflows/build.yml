name: build-and-e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: wps-docx2pdf
  # WPS deb 附件：GitHub Release 自家 CDN，境外 runner 下载比阿里云更快更稳
  WPS_DEB_URL: https://github.com/xna00/wps-docker/releases/download/wps-11.1.0.9662/wps-office_11.1.0.9662_amd64.deb

jobs:
  # ------------------------------------------------------------------
  # 1) 构建镜像（WPS deb 走 GitHub Release，apt/pip 走阿里云，适配境外 runner）
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true            # 构建后载入本地，供 test job 使用
          tags: ${{ env.IMAGE_NAME }}:ci
          build-args: |
            WPS_DEB_URL=${{ env.WPS_DEB_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image for test job
        run: docker save ${{ env.IMAGE_NAME }}:ci -o /tmp/${{ env.IMAGE_NAME }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-image
          path: /tmp/${{ env.IMAGE_NAME }}.tar
          retention-days: 1

  # ------------------------------------------------------------------
  # 2) 端到端测试：容器内真跑一次 docx→pdf 并断言 PDF 产物
  # ------------------------------------------------------------------
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/${{ env.IMAGE_NAME }}.tar

      - name: Run end-to-end conversion test
        # 用 --entrypoint 覆盖镜像默认的 entrypoint（否则命令行参数会被当成输入文件）
        run: docker run --rm --entrypoint /bin/bash ${{ env.IMAGE_NAME }}:ci -c "/opt/wpsrpc-rpc/tests/e2e_test.sh"
