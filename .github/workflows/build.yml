name: build-and-e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: wps-docx2pdf

jobs:
  # ------------------------------------------------------------------
  # 1) 构建镜像（默认官方源 + ustc 镜像拉 WPS deb，适配境外 runner）
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true            # 构建后载入本地，供 test job 使用
          tags: ${{ env.IMAGE_NAME }}:ci
          # GitHub runner 在境外：使用官方 apt 源 + ustc 镜像拉 WPS deb（默认 ARG）
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image for test job
        run: docker save ${{ env.IMAGE_NAME }}:ci -o /tmp/${{ env.IMAGE_NAME }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-image
          path: /tmp/${{ env.IMAGE_NAME }}.tar
          retention-days: 1

  # ------------------------------------------------------------------
  # 2) 端到端测试：容器内真跑一次 docx→pdf 并断言 PDF 产物
  # ------------------------------------------------------------------
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/${{ env.IMAGE_NAME }}.tar

      - name: Run end-to-end conversion test
        # 用 --entrypoint 覆盖镜像默认的 entrypoint（否则命令行参数会被当成输入文件）
        run: docker run --rm --entrypoint /bin/bash ${{ env.IMAGE_NAME }}:ci -c "/opt/wpsrpc-rpc/tests/e2e_test.sh"
